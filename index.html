<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bin｜ETF 數據中心</title>
  <style>
    :root {
      --bg: #0f172a; --card-bg: #1e293b; --border: #334155;
      --text: #f8fafc; --sub-text: #94a3b8; --primary: #38bdf8;
      --up: #f43f5e; --dn: #10b981;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 1600px; margin: 0 auto; }
    h1 { margin-bottom: 20px; font-size: 24px; color: var(--primary); }
    
    /* 頁籤控制 */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .tab-btn { background: var(--card-bg); color: var(--sub-text); border: 1px solid var(--border); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; }
    .tab-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 控制區與搜尋 */
    .controls { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
    input[type="text"], select { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; outline: none; }
    
    /* 表格樣式 */
    .table-container { overflow-x: auto; background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: right; font-size: 14px; }
    th, td { padding: 12px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: #0f172a; color: var(--sub-text); font-weight: 600; cursor: pointer; }
    
    /* 鎖定前兩欄：最愛 (left: 0) 與 代碼 (left: 50px) */
    th:first-child, td:first-child { 
      position: sticky; 
      left: 0; 
      z-index: 2; 
      text-align: center; 
      background: #1e293b; 
      width: 45px;
      min-width: 45px;
    }

    th:nth-child(2), td:nth-child(2) {
      position: sticky;
      left: 45px;
      z-index: 2;
      text-align: left;
      background: #1e293b;
      box-shadow: 2px 0 5px rgba(0,0,0,0.3);
    }
    
    th:first-child, th:nth-child(2) { background: #0f172a; z-index: 3; }
    th:nth-child(3), td:nth-child(3) { text-align: left; }
    tr:hover { background: rgba(255, 255, 255, 0.03); }

    /* 星星按鈕樣式 */
    .star-btn {
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      color: #64748b;
      transition: transform 0.1s ease;
    }
    .star-btn.active { color: #f59e0b; }
    .star-btn:active { transform: scale(1.25); }
    
    /* 比對卡片區 */
    .compare-selector { background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
    .compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
    .compare-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; }
    .compare-card h3 { margin: 0 0 10px 0; color: var(--primary); display: flex; justify-content: space-between; }
    .row-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 14px; }
    
    /* 顏色標籤 */
    .up { color: var(--up); font-weight: 600; }
    .dn { color: var(--dn); font-weight: 600; }
    .tag { padding: 2px 8px; border-radius: 4px; font-size: 12px; background: var(--border); }
    .text-blue { color: #60a5fa; }
  </style>
</head>
<body>

<div class="container">
  <h1>📊 Bin｜ETF 數據中心</h1>

  <!-- 切換頁籤 -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('all-view', this)">完整資料總覽</button>
    <button class="tab-btn" onclick="switchTab('compare-view', this)">多檔 ETF 交叉比對</button>
  </div>

  <!-- 分頁一：總覽表格 -->
  <div id="all-view" class="tab-content active">
    <div class="controls">
      <input type="text" id="search" placeholder="搜尋代碼或名稱..." oninput="filterTable()">
      <select id="cat-filter" onchange="filterTable()">
        <option value="">所有類別</option>
        <option value="FAVORITE">⭐ 我的最愛</option>
      </select>
    </div>
    <div class="table-container">
      <table id="etf-table">
        <thead>
          <tr>
            <th>最愛</th>
            <th onclick="sortTable('symbol')">股票代碼</th>
            <th onclick="sortTable('name')">股票名稱</th>
            <th onclick="sortTable('price')">現價</th>
            <th onclick="sortTable('ma240')">240MA年線</th>
            <th onclick="sortTable('bias')">年線乖離率(%)</th>
            <th onclick="sortTable('market_cap')">ETF規模(億)</th>
            <th onclick="sortTable('dividend_4q')">近四季配息</th>
            <th onclick="sortTable('yield')">現價殖利率</th>
            <th onclick="sortTable('annual_return')">年報酬率</th>
            <th onclick="sortTable('ytd_dividend')">今年度累計配息</th>
            <th onclick="sortTable('latest_dividend')">最新配息</th>
            <th>最新除息日期</th>
            <th>最新股利發放日</th>
            <th>除息週期</th>
            <th>類別</th>
          </tr>
        </thead>
        <tbody id="etf-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- 分頁二：多檔比對 -->
  <div id="compare-view" class="tab-content">
    <div class="compare-selector">
      <label>選擇要比對的 ETF（可多選）：</label>
      <select id="compare-select" onchange="addCompareItem(this.value)">
        <option value="">-- 請選擇 ETF --</option>
      </select>
    </div>
    <div id="compare-grid" class="compare-grid"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://sktrmemtvarutrbcpwij.supabase.co';
  const PUBLISHABLE_KEY = 'sb_publishable_iPdnGKeCEfPuH2xZBYK4Sg_G8ivGx1p';
  const _supabase = supabase.createClient(SUPABASE_URL, PUBLISHABLE_KEY);

  let rawData = [];
  let compareList = [];
  const EXCLUDED_CATEGORIES = ['金融股', '其他個股'];

  // 讀取/儲存最愛清單 (localStorage)
  let favorites = JSON.parse(localStorage.getItem('etf_favorites')) || [];

  function toggleFavorite(symbol) {
    const index = favorites.indexOf(symbol);
    if (index > -1) {
      favorites.splice(index, 1);
    } else {
      favorites.push(symbol);
    }
    localStorage.setItem('etf_favorites', JSON.stringify(favorites));
    filterTable(); // 重新整理視圖
  }

  // 動態判斷位數：若有小數點第 3 位則顯示 3 位，否則預設 2 位
  const fmt = (v) => {
    if (v == null || v === '') return '—';
    let num = Number(v);
    if (isNaN(num)) return v;

    const hasDecimal3 = Math.abs(num * 100 - Math.round(num * 100)) > 0.0001;
    return num.toFixed(hasDecimal3 ? 3 : 2);
  };
  
  // 股利配息專用：一律顯示 3 位小數
  const fmtDividend = (v) => {
    if (v == null || v === '') return '—';
    let num = Number(v);
    return isNaN(num) ? v : num.toFixed(3);
  };
  
  // 百分比格式化
  const fmtPercent = (v, showSign = false) => {
    if (v == null || v === '') return '—';
    let num = Number(v);
    if (isNaN(num)) return v;
    const formatted = num.toFixed(2) + '%';
    return (showSign && num > 0) ? '+' + formatted : formatted;
  };

  const fmtDate = (d) => {
    if (!d || d === '—') return '—';
    const date = new Date(d);
    return isNaN(date.getTime()) ? d : `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
  };

  // 初始化載入
  async function loadData() {
    const { data, error } = await _supabase.from('etf_data').select('*').order('symbol');
    if (error) return alert('載入失敗: ' + error.message);
    
    // 過濾非 ETF 資料
    rawData = data.filter(d => !EXCLUDED_CATEGORIES.includes(d.category));

    renderTable(rawData);
    initOptions(rawData);
  }

  // 表格渲染
  function renderTable(data) {
    const tbody = document.getElementById('etf-tbody');
    if (data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="16" style="text-align:center;padding:20px;color:var(--sub-text);">查無符合的 ETF 資料</td></tr>`;
      return;
    }

    tbody.innerHTML = data.map(item => {
      const biasStr = fmtPercent(item.bias, true);
      const biasClass = biasStr.includes('+') ? 'up' : (biasStr.includes('-') ? 'dn' : '');

      const annualStr = fmtPercent(item.annual_return, true);
      const annualClass = annualStr.includes('+') ? 'up' : (annualStr.includes('-') ? 'dn' : '');

      const isFav = favorites.includes(item.symbol);
      const starIcon = isFav ? '⭐' : '☆';
      const starClass = isFav ? 'star-btn active' : 'star-btn';

      return `
        <tr>
          <td>
            <button onclick="toggleFavorite('${item.symbol}')" class="${starClass}" title="${isFav ? '取消最愛' : '加入最愛'}">
              ${starIcon}
            </button>
          </td>
          <td><b>${item.symbol || '—'}</b></td>
          <td>${item.name || '—'}</td>
          <td><b>${fmt(item.price)}</b></td>
          <td>${fmt(item.ma240)}</td>
          <td class="${biasClass}">${biasStr}</td>
          <td>${fmt(item.market_cap)}</td>
          <td class="text-blue">${fmtDividend(item.dividend_4q)}</td>
          <td class="text-blue">${fmtPercent(item.yield)}</td>
          <td class="${annualClass}">${annualStr}</td>
          <td class="text-blue">${fmtDividend(item.dividend_ytd)}</td>
          <td class="text-blue">${fmtDividend(item.dividend_latest)}</td>
          <td>${fmtDate(item.ex_date)}</td>
          <td>${fmtDate(item.pay_date)}</td>
          <td><span class="tag">${item.payout_cycle || '—'}</span></td>
          <td><span class="tag">${item.category || '—'}</span></td>
        </tr>
      `;
    }).join('');
  }

  // 初始化選單類別
  function initOptions(data) {
    const categories = [...new Set(data.map(d => d.category).filter(Boolean))];
    const catSelect = document.getElementById('cat-filter');
    catSelect.innerHTML = '<option value="">所有類別</option><option value="FAVORITE">⭐ 我的最愛</option>';
    categories.forEach(c => catSelect.add(new Option(c, c)));

    const compSelect = document.getElementById('compare-select');
    compSelect.innerHTML = '<option value="">-- 請選擇 ETF --</option>';
    data.forEach(d => compSelect.add(new Option(`${d.symbol} ${d.name}`, d.symbol)));
  }

  // 搜尋與篩選
  function filterTable() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    const cat = document.getElementById('cat-filter').value;

    const filtered = rawData.filter(d => {
      const matchQ = (d.symbol && d.symbol.toLowerCase().includes(q)) || (d.name && d.name.toLowerCase().includes(q));
      
      let matchCat = false;
      if (!cat) {
        matchCat = true;
      } else if (cat === 'FAVORITE') {
        matchCat = favorites.includes(d.symbol);
      } else {
        matchCat = d.category === cat;
      }

      return matchQ && matchCat;
    });
    renderTable(filtered);
  }

  // 多檔比對邏輯
  function addCompareItem(symbol) {
    if (!symbol || compareList.includes(symbol)) return;
    if (compareList.length >= 4) return alert('最多同時比對 4 檔 ETF');
    
    compareList.push(symbol);
    renderCompareCards();
  }

  function removeCompareItem(symbol) {
    compareList = compareList.filter(s => s !== symbol);
    renderCompareCards();
  }

  // 卡片比對渲染
  function renderCompareCards() {
    const grid = document.getElementById('compare-grid');
    grid.innerHTML = compareList.map(sym => {
      const d = rawData.find(item => item.symbol === sym);
      if (!d) return '';

      const biasStr = fmtPercent(d.bias, true);
      const biasClass = biasStr.includes('+') ? 'up' : (biasStr.includes('-') ? 'dn' : '');

      const annualStr = fmtPercent(d.annual_return, true);
      const annualClass = annualStr.includes('+') ? 'up' : (annualStr.includes('-') ? 'dn' : '');

      return `
        <div class="compare-card">
          <h3>
            <span>${d.symbol} ${d.name}</span>
            <button onclick="removeCompareItem('${d.symbol}')" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:16px;">✕</button>
          </h3>
          <div class="row-item"><span>類別</span><span>${d.category || '—'}</span></div>
          <div class="row-item"><span>現價</span><span><b>${fmt(d.price)}</b></span></div>
          <div class="row-item"><span>240MA年線</span><span>${fmt(d.ma240)}</span></div>
          <div class="row-item"><span>年線乖離率</span><span class="${biasClass}">${biasStr}</span></div>
          <div class="row-item"><span>規模(億)</span><span>${fmt(d.market_cap)}</span></div>
          <div class="row-item"><span>近四季配息</span><span class="text-blue">${fmt(d.dividend_4q)}</span></div>
          <div class="row-item"><span>現價殖利率</span><span class="text-blue">${fmtPercent(d.yield)}</span></div>
          <div class="row-item"><span>年報酬率</span><span class="${annualClass}">${annualStr}</span></div>
          <div class="row-item"><span>今年度累計配息</span><span class="text-blue">${fmt(d.dividend_ytd)}</span></div>
          <div class="row-item"><span>最新配息</span><span class="text-blue">${fmt(d.dividend_latest)}</span></div>
          <div class="row-item"><span>最新除息日期</span><span>${fmtDate(d.ex_date)}</span></div>
          <div class="row-item"><span>最新股利發放日</span><span>${fmtDate(d.pay_date)}</span></div>
          <div class="row-item"><span>除息週期</span><span>${d.payout_cycle || '—'}</span></div>
        </div>
      `;
    }).join('');
  }

  // 頁籤切換
  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }

  loadData();
</script>
</body>
</html>
