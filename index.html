<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bin｜ETF 數據中心</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a; --card-bg: #1e293b; --border: #334155;
      --text: #f8fafc; --sub-text: #94a3b8; --primary: #38bdf8;
      --up: #f43f5e; --dn: #10b981;
    }
    * { box-sizing: border-box; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      margin: 0; 
      padding: 12px; 
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .container { max-width: 1720px; margin: 0 auto; }
    
    /* 頂部 Header 與比對控制列 */
    .header-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
    h1 { margin: 0; font-size: 20px; color: var(--primary); display: flex; align-items: center; gap: 6px; font-weight: 800; }
    
    /* 控制區：搜尋、分類、入帳週期與排序 */
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--card-bg); padding: 10px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; }
    input, select { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 7px 10px; border-radius: 8px; font-size: 13px; outline: none; font-weight: 500; }
    input:focus, select:focus { border-color: var(--primary); }
    
    .btn { background: var(--primary); color: #0f172a; border: none; padding: 7px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 13px; }
    .btn:hover { opacity: 0.9; }
    .btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
    .btn-outline:hover { background: rgba(56, 189, 248, 0.1); }

    /* 頁籤控制 */
    .view-tabs { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .tab-btn { background: var(--card-bg); color: var(--sub-text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; text-align: center; }
    .tab-btn.active { background: var(--primary); color: #0f172a; border-color: var(--primary); }

    @media (max-width: 640px) {
      .view-tabs { width: 100%; }
      .tab-btn { flex: 1; padding: 8px 4px; font-size: 12px; }
      .controls { gap: 6px; }
      input, select { font-size: 12px; padding: 6px 8px; }
    }

    /* 卡片檢視網格 */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; position: relative; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .card-title { font-size: 18px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 6px; }
    .card-sub { font-size: 12px; color: var(--sub-text); margin-top: 2px; }
    
    .data-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 13px; margin-bottom: 10px; }
    .row-item { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,0.06); }
    .row-item span:first-child { color: var(--sub-text); font-size: 12px; }
    
    /* 雙欄年化報酬率佈局 */
    .return-dual-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: rgba(0,0,0,0.25); padding: 10px; border-radius: 8px; margin-top: 6px; }
    .return-col-item { display: flex; justify-content: space-between; align-items: center; padding: 2px 0; font-size: 13px; }
    .return-col-item span:first-child { color: var(--sub-text); font-size: 12px; }

    /* 主表格檢視區域 */
    .table-wrapper { overflow-x: auto; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: right; font-size: 14px; }
    th, td { padding: 10px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: #0f172a; color: var(--sub-text); font-weight: 700; cursor: pointer; font-size: 13px; }
    
    /* 📌【主表格 #mainTable】Sticky 第一二欄 */
    #mainTable th:first-child, #mainTable td:first-child { 
      position: sticky; 
      left: 0; 
      z-index: 20; 
      text-align: center; 
      background: #1e293b !important; 
      width: 36px;
      min-width: 36px;
      max-width: 36px;
      padding: 8px 2px;
    }

    #mainTable th:nth-child(2), #mainTable td:nth-child(2) {
      position: sticky;
      left: 36px;
      z-index: 20;
      text-align: left;
      background: #1e293b !important;
      box-shadow: 3px 0 6px rgba(0, 0, 0, 0.4);
      width: 130px;
      min-width: 130px;
      max-width: 130px;
      padding: 8px 6px;
    }
    
    #mainTable th:first-child, #mainTable th:nth-child(2) { background: #0f172a !important; z-index: 22; }
    #mainTable tr:hover td { background: rgba(255, 255, 255, 0.04) !important; }
    #mainTable tr:hover td:first-child, #mainTable tr:hover td:nth-child(2) { background: #273549 !important; }

    /* 最愛星星與比對方塊 */
    .star-btn { 
      background: none; border: none; font-size: 16px; cursor: pointer; color: #64748b; 
      display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 100%;
    }
    .star-btn.active { color: #f59e0b; }
    .compare-checkbox { width: 15px; height: 15px; cursor: pointer; accent-color: var(--primary); }

    /* 漲跌與數據顏色 */
    .num-up { color: #fb7185; font-weight: 700; font-size: 14px; }
    .num-dn { color: #34d399; font-weight: 700; font-size: 14px; }
    .num-neutral { color: var(--text); font-weight: 500; }
    .highlight-val { color: var(--primary); font-weight: 800; font-size: 15px; }
    .text-blue { color: #60a5fa; font-weight: 700; font-size: 15px; }

    /* 配息組別標籤 */
    .cycle-badge { padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; display: inline-block; }
    .cycle-monthly { background-color: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .cycle-q1 { background-color: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
    .cycle-q2 { background-color: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .cycle-q3 { background-color: rgba(236, 72, 153, 0.15); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.3); }
    .cycle-default { background-color: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }

    /* Modal 比對彈窗 */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 10px; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 1400px; max-height: 94vh; overflow-y: auto; padding: 14px; position: relative; }
    .modal-close { position: absolute; top: 10px; right: 14px; font-size: 24px; cursor: pointer; color: var(--sub-text); z-index: 50; }
    
    .compare-table { width: 100%; border-collapse: collapse; }
    .compare-table th, .compare-table td { padding: 10px 10px; text-align: center; border-bottom: 1px solid var(--border); font-size: 13px; }
    
    /* 💡 Modal 第一欄（比對項目）鎖死 */
    .compare-table th:first-child, 
    .compare-table td:first-child { 
      position: sticky !important; 
      left: 0 !important; 
      z-index: 30 !important; 
      text-align: left !important; 
      background: #0f172a !important; 
      box-shadow: 3px 0 6px rgba(0, 0, 0, 0.5); 
      min-width: 110px !important; 
      max-width: 110px !important; 
      width: 110px !important;
      padding-left: 8px !important;
    }
    
    .compare-table th:first-child { 
      z-index: 35 !important; 
      background: #090d16 !important; 
    }

    .compare-table th:nth-child(n+2), 
    .compare-table td:nth-child(n+2) { 
      position: static !important; 
      box-shadow: none !important;
      background: transparent !important;
    }

    /* 💡【關鍵修復】：分組標題列 (例如 📌 基本資訊與規模) 設定死鎖與內襯文字 Sticky */
    .compare-group-row td {
      background: #1e293b !important;
      color: var(--primary) !important;
      font-weight: bold !important;
      text-align: left !important;
      padding: 10px 8px !important;
    }

    /* 分組標題內的文字獨立鎖定在最左側 */
    .compare-group-title {
      position: sticky !important;
      left: 12px !important;
      display: inline-block;
      white-space: nowrap;
      z-index: 40 !important;
      color: var(--primary);
      font-weight: 800;
      font-size: 14px;
    }

    .best-badge { background: rgba(244, 63, 94, 0.2); color: var(--up); padding: 2px 4px; border-radius: 4px; font-size: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 頂部標題與狀態 Bar -->
    <div class="header-bar">
      <h1>📊 Bin｜ETF 數據中心</h1>
      <div id="compareBar" style="display: none; align-items: center; gap: 8px;">
        <span id="compareCount" style="color: var(--primary); font-weight: bold; font-size: 13px;">已選 0 檔</span>
        <button class="btn" onclick="openCompareModal()">🚀 開啟比對</button>
        <button class="btn btn-outline" style="padding:7px 8px;" onclick="clearCompare()">清空</button>
      </div>
    </div>

    <!-- 控制區：搜尋、分類、入帳週期，最右側放「排序選單」 -->
    <div class="controls">
      <input type="text" id="searchInput" placeholder="搜尋代碼/名稱" oninput="filterData()" style="width: 130px;">
      
      <select id="categorySelect" onchange="filterData()">
        <option value="">全部分類</option>
        <option value="FAVORITE">⭐ 我的最愛</option>
      </select>

      <select id="payoutSelect" onchange="filterData()">
        <option value="">全部入帳週期</option>
        <option value="月配">月配息</option>
        <option value="季配">季配息 (3,6,9,12 等)</option>
        <option value="年配">年配 / 半年配</option>
      </select>

      <select id="sortSelect" onchange="filterData()" style="margin-left: auto;">
        <option value="symbol">依代碼排序</option>
        <option value="yield_desc">殖利率 (高 → 低)</option>
        <option value="market_cap_desc">規模 (大 → 小)</option>
        <option value="return_1y_desc">1年報酬率 (高 → 低)</option>
        <option value="return_3y_desc">3年化報酬率 (高 → 低)</option>
      </select>

      <div style="font-size: 12px; color: var(--sub-text); font-weight: 600;" id="dataCount">
        載入中...
      </div>
    </div>

    <!-- 頁籤選擇 -->
    <div class="view-tabs">
      <button class="tab-btn" onclick="switchView('card', this)">🎴 卡片</button>
      <button class="tab-btn active" onclick="switchView('dividend', this)">💰 查看 ETF 配息</button>
      <button class="tab-btn" onclick="switchView('performance', this)">📈 查看 ETF 績效</button>
    </div>

    <!-- 1. 卡片視圖容器 -->
    <div id="cardView" class="card-grid" style="display: none;"></div>

    <!-- 2. 表格視圖容器 -->
    <div id="tableView" class="table-wrapper">
      <table id="mainTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

  </div>

  <!-- 多檔橫向比對彈出視窗 Modal -->
  <div id="compareModal" class="modal-overlay">
    <div class="modal-content">
      <span class="modal-close" onclick="closeCompareModal()">&times;</span>
      <h2 style="margin-top: 0; color: var(--primary); font-size: 18px;">⚖️ ETF 多檔橫向深度比對</h2>
      <p style="color: var(--sub-text); font-size: 12px; margin-bottom: 12px;">跨緯度評估不同 ETF 之股息殖利率、年化報酬率與績效表現</p>
      
      <div class="table-wrapper">
        <table class="compare-table" id="compareMatrixTable"></table>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. Supabase 連線與狀態設定
    // ==========================================
    const SUPABASE_URL = 'https://sktrmemtvarutrbcpwij.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_iPdnGKeCEfPuH2xZBYK4Sg_G8ivGx1p';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let rawEtfData = [];
    let filteredEtfData = [];
    let selectedCompareSymbols = new Set();
    
    let currentView = 'dividend'; 
    let favorites = JSON.parse(localStorage.getItem('etf_favorites')) || [];

    const fmt = num => (num !== null && num !== undefined && !isNaN(num)) ? Number(num).toLocaleString() : '-';
    const fmtPct = (val, showSign = false) => {
      if (val === null || val === undefined || isNaN(val)) return '-';
      const num = Number(val);
      const str = num.toFixed(2) + '%';
      return (showSign && num > 0) ? '+' + str : str;
    };
    
    function getValClass(val) {
      if (val === null || val === undefined || isNaN(val) || val === 0) return 'num-neutral';
      return val > 0 ? 'num-up' : 'num-dn';
    }

    const cleanSymbol = sym => {
      let str = String(sym || '').trim().toUpperCase();
      if (!str) return '';
      if (str.length === 3 && /^\d/.test(str)) return str.padStart(5, '0');
      if (str.length === 4 && /[A-Z]$/.test(str)) return str.padStart(5, '0');
      return str;
    };

    function getCycleBadgeHtml(cycleStr) {
      if (!cycleStr || cycleStr === '-') return `<span class="cycle-badge cycle-default">-</span>`;
      
      const str = String(cycleStr).trim();
      if (str.includes('月配')) {
        return `<span class="cycle-badge cycle-monthly">${str}</span>`;
      }

      const months = str.split(',').map(m => parseInt(m.trim(), 10)).filter(m => !isNaN(m));
      if (months.includes(1) || months.includes(4) || months.includes(7) || months.includes(10)) {
        return `<span class="cycle-badge cycle-q1">${str}</span>`;
      }
      if (months.includes(2) || months.includes(5) || months.includes(8) || months.includes(11)) {
        return `<span class="cycle-badge cycle-q2">${str}</span>`;
      }
      if (months.includes(3) || months.includes(6) || months.includes(9) || months.includes(12)) {
        return `<span class="cycle-badge cycle-q3">${str}</span>`;
      }

      return `<span class="cycle-badge cycle-default">${str}</span>`;
    }

    function toggleFavorite(symbol, e) {
      if (e) e.stopPropagation();
      const index = favorites.indexOf(symbol);
      if (index > -1) favorites.splice(index, 1);
      else favorites.push(symbol);

      localStorage.setItem('etf_favorites', JSON.stringify(favorites));
      filterData();
    }

    // ==========================================
    // 2. 載入 Supabase 數據
    // ==========================================
    async function loadEtfData() {
      try {
        const { data, error } = await supabaseClient
          .from('etf_data')
          .select(`
            symbol, name, price, ma240, bias, market_cap, dividend_4q, yield, 
            annual_return, dividend_ytd, dividend_latest, ex_date, pay_date, 
            dividend_cycle, payout_cycle, category,
            return_3m, return_6m, return_ytd, return_2y, return_3y, return_5y
          `)
          .order('symbol', { ascending: true });

        if (error) throw error;

        rawEtfData = (data || []).map(d => ({
          ...d,
          symbol: cleanSymbol(d.symbol)
        })).filter(d => !['金融股', '其他個股'].includes(d.category));

        populateCategories();
        filterData();

      } catch (err) {
        console.error('載入 ETF 數據失敗:', err);
        document.getElementById('tableView').innerHTML = `<div style="color:var(--up); padding:20px;">❌ 資料載入失敗：${err.message}</div>`;
      }
    }

    function populateCategories() {
      const categories = [...new Set(rawEtfData.map(d => d.category).filter(Boolean))];
      const select = document.getElementById('categorySelect');
      select.innerHTML = '<option value="">全部分類</option><option value="FAVORITE">⭐ 我的最愛</option>';
      categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });
    }

    // ==========================================
    // 3. 搜尋與週期篩選 Engine
    // ==========================================
    function filterData() {
      const search = document.getElementById('searchInput').value.trim().toUpperCase();
      const category = document.getElementById('categorySelect').value;
      const payout = document.getElementById('payoutSelect').value;
      const sort = document.getElementById('sortSelect').value;

      filteredEtfData = rawEtfData.filter(d => {
        const matchSearch = !search || d.symbol.includes(search) || (d.name && d.name.toUpperCase().includes(search));
        
        let matchCat = true;
        if (category === 'FAVORITE') matchCat = favorites.includes(d.symbol);
        else if (category) matchCat = d.category === category;

        let matchPayout = true;
        if (payout) {
          const cycleStr = String(d.payout_cycle || '');
          const monthCount = cycleStr.split(',').map(m => parseInt(m.trim(), 10)).filter(m => !isNaN(m)).length;

          if (payout === '月配') {
            matchPayout = cycleStr.includes('月配') || monthCount === 12;
          } else if (payout === '季配') {
            matchPayout = !cycleStr.includes('月配') && (monthCount === 4 || cycleStr.includes('季'));
          } else if (payout === '年配') {
            matchPayout = !cycleStr.includes('月配') && (monthCount >= 1 && monthCount <= 2 || cycleStr.includes('年') || cycleStr.includes('半'));
          }
        }

        return matchSearch && matchCat && matchPayout;
      });

      filteredEtfData.sort((a, b) => {
        if (sort === 'yield_desc') return (b.yield || 0) - (a.yield || 0);
        if (sort === 'market_cap_desc') return (b.market_cap || 0) - (a.market_cap || 0);
        if (sort === 'return_1y_desc') return (b.annual_return || 0) - (a.annual_return || 0);
        if (sort === 'return_3y_desc') return (b.return_3y || 0) - (a.return_3y || 0);
        return a.symbol.localeCompare(b.symbol);
      });

      document.getElementById('dataCount').textContent = `共 ${filteredEtfData.length} 檔`;

      renderCurrentView();
    }

    function renderCurrentView() {
      if (currentView === 'card') {
        document.getElementById('cardView').style.display = 'grid';
        document.getElementById('tableView').style.display = 'none';
        renderCardView();
      } else {
        document.getElementById('cardView').style.display = 'none';
        document.getElementById('tableView').style.display = 'block';
        renderTableView();
      }
    }

    // ==========================================
    // 4. 卡片檢視渲染
    // ==========================================
    function renderCardView() {
      const container = document.getElementById('cardView');
      if (filteredEtfData.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:30px; color:var(--sub-text);">無符合條件的 ETF 標的</div>`;
        return;
      }

      container.innerHTML = filteredEtfData.map(d => {
        const isFav = favorites.includes(d.symbol);
        const isChecked = selectedCompareSymbols.has(d.symbol) ? 'checked' : '';
        return `
          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title">
                  <button class="star-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${d.symbol}', event)">
                    ${isFav ? '⭐' : '☆'}
                  </button>
                  ${d.symbol}
                </div>
                <div class="card-sub">${d.name || '-'}</div>
              </div>
              <label style="display:flex; align-items:center; gap:4px; font-size:12px; cursor:pointer; color:var(--sub-text);">
                <input type="checkbox" class="compare-checkbox" onchange="toggleCompare('${d.symbol}')" ${isChecked}>
                比對
              </label>
            </div>

            <div class="data-row">
              <div class="row-item"><span>現價</span><span class="highlight-val">$${fmt(d.price)}</span></div>
              <div class="row-item"><span>規模(億)</span><span>$${fmt(d.market_cap)}</span></div>
              <div class="row-item"><span>近四季配息</span><span class="highlight-val">$${fmt(d.dividend_4q)}</span></div>
              <div class="row-item"><span>現價殖利率</span><span class="highlight-val">${fmtPct(d.yield)}</span></div>
              <div class="row-item"><span>最新配息</span><span class="text-blue">$${fmt(d.dividend_latest)}</span></div>
              <div class="row-item"><span>最新發放日</span><span>${d.pay_date || '-'}</span></div>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; padding-top:2px;">
              <span style="font-size:12px; color:var(--sub-text);">入帳週期：</span>
              ${getCycleBadgeHtml(d.payout_cycle)}
            </div>

            <div style="font-size:11px; color:var(--sub-text); margin-top:8px; font-weight:600;">📈 多期間績效與年化報酬率：</div>
            <div class="return-dual-col">
              <div>
                <div class="return-col-item"><span>3個月</span><span class="${getValClass(d.return_3m)}">${fmtPct(d.return_3m, true)}</span></div>
                <div class="return-col-item"><span>6個月</span><span class="${getValClass(d.return_6m)}">${fmtPct(d.return_6m, true)}</span></div>
                <div class="return-col-item"><span>今年至今</span><span class="${getValClass(d.return_ytd)}">${fmtPct(d.return_ytd, true)}</span></div>
              </div>
              <div>
                <div class="return-col-item"><span>1年化</span><span class="${getValClass(d.annual_return)}">${fmtPct(d.annual_return, true)}</span></div>
                <div class="return-col-item"><span>3年化</span><span class="${getValClass(d.return_3y)}">${fmtPct(d.return_3y, true)}</span></div>
                <div class="return-col-item"><span>5年化</span><span class="${getValClass(d.return_5y)}">${fmtPct(d.return_5y, true)}</span></div>
              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    // ==========================================
    // 5. 表格渲染 Engine
    // ==========================================
    function renderTableView() {
      const thead = document.getElementById('tableHead');
      const tbody = document.getElementById('tableBody');

      if (filteredEtfData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="15" style="text-align:center; padding:30px;">無符合條件的數據</td></tr>`;
        return;
      }

      if (currentView === 'dividend') {
        thead.innerHTML = `
          <tr>
            <th style="width:36px; text-align:center;">最愛</th>
            <th style="text-align:left;">比對 / 代碼 / 名稱</th>
            <th>現價</th>
            <th>ETF規模(億)</th>
            <th>近四季配息</th>
            <th>現價殖利率</th>
            <th>今年度累計配息</th>
            <th>最新配息</th>
            <th>最新除息日期</th>
            <th>最新股利發放日</th>
            <th>除息週期</th>
            <th>入帳週期</th>
            <th>類別</th>
          </tr>
        `;

        tbody.innerHTML = filteredEtfData.map(d => {
          const isFav = favorites.includes(d.symbol);
          const isChecked = selectedCompareSymbols.has(d.symbol) ? 'checked' : '';
          return `
            <tr>
              <td style="text-align:center;">
                <button class="star-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${d.symbol}', event)">
                  ${isFav ? '⭐' : '☆'}
                </button>
              </td>
              <td style="text-align:left;">
                <div style="display:flex; align-items:center; gap:6px;">
                  <input type="checkbox" class="compare-checkbox" onchange="toggleCompare('${d.symbol}')" ${isChecked}>
                  <div style="overflow:hidden;">
                    <strong style="color:var(--primary); font-size:14px; display:block; line-height:1.1;">${d.symbol}</strong>
                    <span style="font-size:11px; color:var(--sub-text); display:block; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${d.name || ''}</span>
                  </div>
                </div>
              </td>
              <td class="highlight-val">$${fmt(d.price)}</td>
              <td>$${fmt(d.market_cap)}</td>
              <td class="text-blue">$${fmt(d.dividend_4q)}</td>
              <td class="text-blue">${fmtPct(d.yield)}</td>
              <td class="text-blue">$${fmt(d.dividend_ytd)}</td>
              <td class="text-blue">$${fmt(d.dividend_latest)}</td>
              <td>${d.ex_date || '-'}</td>
              <td>${d.pay_date || '-'}</td>
              <td>${getCycleBadgeHtml(d.dividend_cycle)}</td>
              <td>${getCycleBadgeHtml(d.payout_cycle)}</td>
              <td><span class="cycle-badge cycle-default">${d.category || '-'}</span></td>
            </tr>
          `;
        }).join('');

      } else if (currentView === 'performance') {
        thead.innerHTML = `
          <tr>
            <th style="width:36px; text-align:center;">最愛</th>
            <th style="text-align:left;">比對 / 代碼 / 名稱</th>
            <th>現價</th>
            <th>240MA年線</th>
            <th>年線乖離率(%)</th>
            <th>1年報酬率</th>
            <th>3M</th>
            <th>6M</th>
            <th>YTD</th>
            <th>2Y化</th>
            <th>3Y化</th>
            <th>5Y化</th>
          </tr>
        `;

        tbody.innerHTML = filteredEtfData.map(d => {
          const isFav = favorites.includes(d.symbol);
          const isChecked = selectedCompareSymbols.has(d.symbol) ? 'checked' : '';
          return `
            <tr>
              <td style="text-align:center;">
                <button class="star-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${d.symbol}', event)">
                  ${isFav ? '⭐' : '☆'}
                </button>
              </td>
              <td style="text-align:left;">
                <div style="display:flex; align-items:center; gap:6px;">
                  <input type="checkbox" class="compare-checkbox" onchange="toggleCompare('${d.symbol}')" ${isChecked}>
                  <div style="overflow:hidden;">
                    <strong style="color:var(--primary); font-size:14px; display:block; line-height:1.1;">${d.symbol}</strong>
                    <span style="font-size:11px; color:var(--sub-text); display:block; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${d.name || ''}</span>
                  </div>
                </div>
              </td>
              <td class="highlight-val">$${fmt(d.price)}</td>
              <td>$${fmt(d.ma240)}</td>
              <td class="${getValClass(d.bias)}">${fmtPct(d.bias, true)}</td>
              <td class="${getValClass(d.annual_return)}">${fmtPct(d.annual_return, true)}</td>
              <td class="${getValClass(d.return_3m)}">${fmtPct(d.return_3m, true)}</td>
              <td class="${getValClass(d.return_6m)}">${fmtPct(d.return_6m, true)}</td>
              <td class="${getValClass(d.return_ytd)}">${fmtPct(d.return_ytd, true)}</td>
              <td class="${getValClass(d.return_2y)}">${fmtPct(d.return_2y, true)}</td>
              <td class="${getValClass(d.return_3y)}">${fmtPct(d.return_3y, true)}</td>
              <td class="${getValClass(d.return_5y)}">${fmtPct(d.return_5y, true)}</td>
            </tr>
          `;
        }).join('');
      }
    }

    function switchView(view, btn) {
      currentView = view;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCurrentView();
    }

    // ==========================================
    // 6. 多檔橫向比對 Modal
    // ==========================================
    function toggleCompare(symbol) {
      if (selectedCompareSymbols.has(symbol)) {
        selectedCompareSymbols.delete(symbol);
      } else {
        selectedCompareSymbols.add(symbol);
      }
      updateCompareBar();
    }

    function updateCompareBar() {
      const bar = document.getElementById('compareBar');
      const countText = document.getElementById('compareCount');
      if (selectedCompareSymbols.size > 0) {
        bar.style.display = 'flex';
        countText.textContent = `已選 ${selectedCompareSymbols.size} 檔`;
      } else {
        bar.style.display = 'none';
      }
    }

    function clearCompare() {
      selectedCompareSymbols.clear();
      updateCompareBar();
      renderCurrentView();
    }

    function openCompareModal() {
      if (selectedCompareSymbols.size === 0) return;

      const compareList = rawEtfData.filter(d => selectedCompareSymbols.has(d.symbol));
      const modal = document.getElementById('compareModal');
      const table = document.getElementById('compareMatrixTable');

      const maxYield = Math.max(...compareList.map(d => d.yield || -999));
      const maxReturn1Y = Math.max(...compareList.map(d => d.annual_return || -999));
      const maxReturn3Y = Math.max(...compareList.map(d => d.return_3y || -999));

      // 💡【關鍵修復】：將分組標題文字加上 <span class="compare-group-title"> 固定住
      let html = `
        <thead>
          <tr>
            <th style="text-align:left;">比對項目</th>
            ${compareList.map(d => `
              <th>
                <div style="font-size:15px; color:var(--primary); font-weight:800;">${d.symbol}</div>
                <div style="font-size:11px; color:var(--sub-text); font-weight:normal; white-space:nowrap;">${d.name || ''}</div>
              </th>
            `).join('')}
          </tr>
        </thead>
        <tbody>
          <tr class="compare-group-row">
            <td colspan="${compareList.length + 1}">
              <span class="compare-group-title">📌 基本資訊與規模</span>
            </td>
          </tr>
          <tr>
            <td style="text-align:left; color:var(--sub-text);">現價</td>
            ${compareList.map(d => `<td class="highlight-val">$${fmt(d.price)}</td>`).join('')}
          </tr>
          <tr>
            <td style="text-align:left; color:var(--sub-text);">基金規模(億)</td>
            ${compareList.map(d => `<td>$${fmt(d.market_cap)}</td>`).join('')}
          </tr>
          <tr>
            <td style="text-align:left; color:var(--sub-text);">入帳週期</td>
            ${compareList.map(d => `<td>${getCycleBadgeHtml(d.payout_cycle)}</td>`).join('')}
          </tr>

          <tr class="compare-group-row">
            <td colspan="${compareList.length + 1}">
              <span class="compare-group-title">💰 配息表現</span>
            </td>
          </tr>
          <tr>
            <td style="text-align:left; color:var(--sub-text);">近四季累積配息</td>
            ${compareList.map(d => `<td class="highlight-val">$${fmt(d.dividend_4q)}</td>`).join('')}
          </tr>
          <tr>
            <td style="text-align:left; color:var(--sub-text);">最新單期配息</td>
            ${compareList.map(d => `<td class="text-blue">$${fmt(d.dividend_latest)}</td>`).join('')}
          </tr>
          <tr>
            <td style="text-align:left; color:var(--sub-text);">現價股息殖利率</td>
            ${compareList.map(d => {
              const isBest = d.yield && d.yield === maxYield;
              return `<td class="${getValClass(d.yield)}">
                ${fmtPct(d.yield)}${isBest ? '<span class="best-badge">最高</span>' : ''}
              </td>`;
            }).join('')}
          </tr>

          <tr class="compare-group-row">
            <td colspan="${compareList.length + 1}">
              <span class="compare-group-title">📈 績效與年化報酬率對決</span>
            </td>
          </tr>
          <tr>
            <td style="text-align:left; color:var(--sub-text);">3 個月報酬率</td>
            ${compareList.map(d => `<td class="${getValClass(d.return_3m)}">${fmtPct(d.return_3m, true)}</td>`).join('')}
          </tr>
          <tr>
            <td style="text-align:left; color:var(--sub-text);">6 個月報酬率</td>
            ${compareList.map(d => `<td class="${getValClass(d.return_6m)}">${fmtPct(d.return_6m, true)}</td>`).join('')}
          </tr>
          <tr>
            <td style="text-align:left; color:var(--sub-text);">今年至今 (YTD)</td>
            ${compareList.map(d => `<td class="${getValClass(d.return_ytd)}">${fmtPct(d.return_ytd, true)}</td>`).join('')}
          </tr>
          <tr>
            <td style="text-align:left; color:var(--sub-text);">1 年化報酬率</td>
            ${compareList.map(d => {
              const isBest = d.annual_return && d.annual_return === maxReturn1Y;
              return `<td class="${getValClass(d.annual_return)}">
                ${fmtPct(d.annual_return, true)}${isBest ? '<span class="best-badge">領先</span>' : ''}
              </td>`;
            }).join('')}
          </tr>
          <tr>
            <td style="text-align:left; color:var(--sub-text);">3 年化報酬率</td>
            ${compareList.map(d => {
              const isBest = d.return_3y && d.return_3y === maxReturn3Y;
              return `<td class="${getValClass(d.return_3y)}">
                ${fmtPct(d.return_3y, true)}${isBest ? '<span class="best-badge">領先</span>' : ''}
              </td>`;
            }).join('')}
          </tr>
          <tr>
            <td style="text-align:left; color:var(--sub-text);">5 年化報酬率</td>
            ${compareList.map(d => `<td class="${getValClass(d.return_5y)}">${fmtPct(d.return_5y, true)}</td>`).join('')}
          </tr>
        </tbody>
      `;

      table.innerHTML = html;
      modal.classList.add('active');
    }

    function closeCompareModal() {
      document.getElementById('compareModal').classList.remove('active');
    }

    window.addEventListener('DOMContentLoaded', loadEtfData);
  </script>
</body>
</html>
